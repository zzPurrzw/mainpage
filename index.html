<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zzPurrzw - Home</title>
    <style>
        /* Reset y fuente estilo Scratch */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background-color: #f3f3f3; color: #575e75; }

        /* UI de Scratch - Barra Superior Cyan */
        .navbar { 
            background-color: #424242; 
            display: flex; 
            align-items: center; 
            padding: 0 16px; 
            height: 48px; 
            color: white; 
            font-size: 13px; 
            font-weight: bold;
        }
        .navbar .nav-item { margin-right: 20px; cursor: pointer; }
        .navbar .nav-item:hover { color: #e0f8f8; }
        
        .btn-see-inside { 
            background: transparent; 
            border: 1px solid white; 
            color: white; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .btn-see-inside:hover { background: rgba(255,255,255,0.2); }

        .title-input { 
            margin-left: 20px; 
            background: white; 
            color: #4b4b4b; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            width: 350px; 
            font-weight: bold;
        }

        /* Contenedor Central */
        .main-content { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding-top: 5vh; 
        }

        /* Marco exterior tipo Reproductor */
        .stage-container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d9d9d9;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Controles (Bandera y Pausa) */
        .controls { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 10px; 
            align-items: center; 
        }
        .controls span { cursor: pointer; font-size: 20px; user-select: none; }
        .icon-flag { color: #4caf50; }
        .icon-stop { color: #f44336; }

        /* TU INTERFAZ ORIGINAL (El Hub Oscuro incrustado) */
        .stage { 
            background-color: #0d1117; 
            color: #c9d1d9;
            width: 600px; 
            height: 360px; 
            border-radius: 8px; 
            border: 2px solid #30363d; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            text-align: center;
            padding: 20px;
        }

        .stage h1 { color: #5f5f5f; font-size: 2.5rem; margin-bottom: 10px; }
        .stage p { font-size: 1.1rem; color: #8b949e; margin-bottom: 40px; }

        /* Tu botón verde "open teh cool editor" */
        .btn {
            background-color: #238636;
            color: rgb(0, 0, 0);
            padding: 12px 24px;
            text-decoration: none;
            font-size: 1.1rem;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>
    
    <div class="navbar">
        <div class="nav-item">123</div>
        <div class="nav-item">hi</div>
        <div class="nav-item">yo</div>
        <div class="nav-item">uh</div>
        <div class="nav-item">yoooooooooo</div>
        <button class="btn-see-inside">🔄 See inside</button>
        <input class="title-input" type="text" value="back to the very very super cool home idk but uh yeah super cool" readonly>
    </div>

    <div class="main-content">
        <div class="stage-container">
            
            <div class="controls">
                <span class="icon-flag">dont look at me</span>
                <span class="icon-stop">also dont look at me</span>
                <span style="margin-left: 10px; font-size: 14px; color: #999;">🔊 ────────</span>
            </div>

            <div class="stage">
                <h1>welcomeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee</h1>
                <p>Welcome to the uhm yeah zzPurrzw hii</p>
                <a href="https://zzpurrzw.github.io/editor.html" class="btn">open teh cool editor</a>
            </div>

        </div>
    </div>

</body>
</html>
